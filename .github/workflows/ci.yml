name: Fork Security CI
on:
  push:
    branches: [main, security/local-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify hardened fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without saved credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --prefix "$RUNNER_TEMP/pnpm-cli" --ignore-scripts --no-audit --no-fund pnpm@10.14.0
      - name: Install frozen dependencies without lifecycle scripts
        run: node "$RUNNER_TEMP/pnpm-cli/node_modules/pnpm/bin/pnpm.cjs" install --frozen-lockfile --ignore-scripts
      - name: Lint and typecheck
        run: |
          node node_modules/@biomejs/biome/bin/biome ci .
          node node_modules/typescript/bin/tsc --noEmit
          node node_modules/typescript/bin/tsc -p mcp-apps/tsconfig.json --noEmit
      - name: Build validated sources
        run: node "$RUNNER_TEMP/pnpm-cli/node_modules/pnpm/bin/pnpm.cjs" run build
      - name: Unit and integration tests
        run: |
          node node_modules/vitest/vitest.mjs run
          node node_modules/vitest/vitest.mjs run --config vitest.integration.config.cts
      - name: Build and test the offline MCP protocol
        run: |
          node scripts/seal-local.mjs
          node scripts/test-local-integrity.mjs
          node scripts/smoke-local.mjs
